<style>

  .nav-tabs { display: flex; margin-top: 10px; border-top: 1px solid #1e3a55; }
  .nav-tab {
    flex: 1; padding: 10px 0; text-align: center; font-size: 0.85rem; font-weight: 700;

    transition: color 0.2s, border-color 0.2s; -webkit-tap-highlight-color: transparent;

  .nav-tab.active { color: #f5a623; border-bottom-color: #f5a623; }
  .nav-tab:active { background: rgba(255,255,255,0.05); }

  .stat { text-align: center; }
  .stat-num { font-size: 1.4rem; font-weight: 800; color: #f5a623; line-height: 1; }
  .stat-label { font-size: 0.65rem; color: #aac4de; text-transform: uppercase; letter-spacing: 0.5px; }

  .search-bar { padding: 10px 14px; background: #122236; }
  .search-bar input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e3a55; background: #0d1b2a; color: #fff; font-size: 0.9rem; outline: none; }

  .search-bar input:focus { border-color: #f5a623; }

  .teams-container { padding: 10px 14px 80px; }

  .team-flag-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
  .team-flag { font-size: 1.2rem; }
  .team-badge { display: flex; align-items: center; gap: 8px; }
  .team-count { font-size: 0.75rem; color: #aac4de; }
  .team-count span { color: #f5a623; font-weight: 700; }
  .chevron { color: #4a6a85; font-size: 0.8rem; transition: transform 0.2s; }
  .team-block.open .chevron { transform: rotate(180deg); }
  .all-done-badge { font-size: 0.7rem; background: #1a4a1a; color: #4ade80; padding: 2px 8px; border-radius: 20px; font-weight: 700; }

  .nums-grid { display: none; padding: 8px 12px 12px; gap: 6px; flex-wrap: wrap; border-top: 1px solid #1e3a55; }
  .team-block.open .nums-grid { display: flex; }

  .figu-btn { width: 40px; height: 40px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; -webkit-tap-highlight-color: transparent; }
  .figu-btn:active { transform: scale(0.88); }
  .figu-btn.missing { background: #c0392b; color: #fff; }
  .figu-btn.got { background: #1a3a1a; color: #4ade80; opacity: 0.5; text-decoration: line-through; }

  /* REPETIDAS STYLES */
  .figu-btn-rep {
    min-width: 44px; height: 44px; border-radius: 8px; border: none;
    font-size: 0.75rem; font-weight: 700; cursor: pointer;
    transition: transform 0.1s; -webkit-tap-highlight-color: transparent;
    padding: 0 6px; position: relative;
  }
  .figu-btn-rep:active { transform: scale(0.88); }
  .figu-btn-rep.rep-none { background: #1e3a55; color: #aac4de; }
  .figu-btn-rep.rep-has { background: #c0392b; color: #fff; }
  .rep-count-badge {
    position: absolute; top: -5px; right: -5px;
    background: #f5a623; color: #0d1b2a;
    font-size: 0.6rem; font-weight: 800;
    border-radius: 10px; padding: 1px 4px; line-height: 1.3;
    min-width: 16px; text-align: center;

  .rep-stat-num { color: #4ade80 !important; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: #122236; border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 320px; border: 1px solid #f5a623; text-align: center; animation: popIn 0.15s ease; }

  .modal-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 6px; color: #f5a623; }
  .modal p { font-size: 0.85rem; color: #aac4de; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .btn-cancel, .btn-confirm { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-cancel { background: #1e3a55; color: #aac4de; }
  .btn-confirm { background: #f5a623; color: #0d1b2a; }
  .btn-cancel:active { background: #2a4a65; }
  .btn-confirm:active { background: #d4901f; }

  .modal-rep { border-color: #c0392b; }
  .modal-rep h2 { color: #e74c3c; }
  .rep-counter { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 16px 0; }

      if (local) {
        state = JSON.parse(local);
        await guardarEnSupabase();
        localStorage.removeItem(LOCAL_KEY);
      } else {
        estadoInicial();
        await guardarEnSupabase();
      }
    }
  } catch(e) {
    const local = localStorage.getItem(LOCAL_KEY);
    if (local) { state = JSON.parse(local); } else { estadoInicial(); }
  }
  document.getElementById('loadingMsg').style.display = 'none';
  renderTeams();
  updateStats();
}

async function guardarEnSupabase() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/figus?id=eq.${ROW_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ state, updated_at: new Date().toISOString() })
    });
  } catch(e) { console.log('Sin conexión, guardado solo local'); }
}

function saveState() { guardarEnSupabase(); }

function updateStats() {
  let totalFaltan = 0, totalTienen = 0, equiposCompletos = 0;
  teamsData.forEach(t => {
    const got = state[t.code] || [];
    const faltan = t.all.length - got.length;
    totalFaltan += faltan; totalTienen += got.length;
    if (faltan === 0) equiposCompletos++;
  });
  document.getElementById('totalFaltan').textContent = totalFaltan;
  document.getElementById('totalConseguidas').textContent = totalTienen;
  document.getElementById('totalEquipos').textContent = equiposCompletos + '/' + teamsData.length;
}

function renderTeams(filter = '') {
  const container = document.getElementById('teamsContainer');
  const filtered = teamsData.filter(t => t.code.toLowerCase().includes((filter||'').toLowerCase()));
  if (filtered.length === 0) { container.innerHTML = '<div class="empty-msg">No se encontró ese equipo</div>'; return; }
  container.innerHTML = '';
  filtered.forEach(team => {
    const got = state[team.code] || [];
    const faltan = team.all.length - got.length;
    const allDone = faltan === 0;
    const block = document.createElement('div');
    block.className = 'team-block';
    block.dataset.code = team.code;
    block.innerHTML = `
      <div class="team-header" onclick="toggleTeam('${team.code}')">
        <div class="team-flag-name"><span class="team-flag">${team.flag}</span><span>${team.code}</span></div>
        <div class="team-badge">
          ${allDone ? '<span class="all-done-badge">✅ Completo</span>' : `<span class="team-count">Faltan <span>${faltan}</span></span>`}
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="nums-grid">
        ${team.all.map(n => {
          const key = String(n);
          const isGot = got.includes(key);
          return `<button class="figu-btn ${isGot ? 'got' : 'missing'}" onclick="askConfirm('${team.code}','${key}','${team.code}',${isGot})">${n}</button>`;
        }).join('')}
      </div>`;
    container.appendChild(block);
  });
}

function toggleTeam(code) {
  const block = document.querySelector(`.team-block[data-code="${code}"]`);
  if (!block) return;
  const isOpen = block.classList.contains('open');
  document.querySelectorAll('.team-block.open').forEach(b => b.classList.remove('open'));
  if (!isOpen) block.classList.add('open');
}

function filterTeams(val) { renderTeams(val); }

function askConfirm(teamCode, num, teamName, isGot) {
  pending = { teamCode, num, isGot };
  document.getElementById('modalTitle').textContent = isGot ? '¿Marcarla como faltante?' : '¿La consiguieron?';
  document.getElementById('modalText').textContent = isGot
    ? `La figu #${num} de ${teamName} va a quedar como faltante.`
    : `La figu #${num} de ${teamName} se marca como conseguida. 🎉`;
  document.getElementById('btnConfirm').textContent = isGot ? '¡Sí, me falta!' : '¡Sí, la tengo!';
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  pending = null;
}

function confirmGot() {
  if (!pending) return;
  const { teamCode, num, isGot } = pending;
  if (!state[teamCode]) state[teamCode] = [];
  if (isGot) { state[teamCode] = state[teamCode].filter(n => n !== num); }
  else { if (!state[teamCode].includes(num)) state[teamCode].push(num); }
  const openCode = teamCode;
  saveState(); closeModal();
  renderTeams(document.getElementById('searchInput').value);
  const block = document.querySelector(`.team-block[data-code="${openCode}"]`);
  if (block) block.classList.add('open');
  updateStats();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ========== REPETIDAS ==========
async function cargarRepetidas() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/figus?id=eq.${REP_ROW_ID}&select=state`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data[0] && data[0].state && Object.keys(data[0].state).length > 0) {
      repState = data[0].state;
    } else {
      // Inicializar con los datos del PDF
      repState = JSON.parse(JSON.stringify(repetidasIniciales));
      await guardarRepetidas();
    }
  } catch(e) {
    const local = localStorage.getItem(REP_LOCAL_KEY);
    if (local) { repState = JSON.parse(local); }
    else { repState = JSON.parse(JSON.stringify(repetidasIniciales)); }
  }
}

async function guardarRepetidas() {
  localStorage.setItem(REP_LOCAL_KEY, JSON.stringify(repState));
  try {
    // Intentar PATCH primero, si falla hacer POST
    const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/figus?id=eq.${REP_ROW_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ state: repState, updated_at: new Date().toISOString() })
    });
    // Si no existe la fila, crear
    if (patchRes.status === 404 || patchRes.status === 406) {
      await fetch(`${SUPABASE_URL}/rest/v1/figus`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ id: REP_ROW_ID, state: repState, updated_at: new Date().toISOString() })
      });
    }
  } catch(e) { console.log('Sin conexión, rep guardada solo local'); }
}

function updateRepStats() {
  let totalRep = 0, equiposConRep = 0;
  teamsData.forEach(t => {
    const rep = repState[t.code] || {};
    const sumEquipo = Object.values(rep).reduce((a,b) => a+b, 0);
    totalRep += sumEquipo;
    if (sumEquipo > 0) equiposConRep++;
  });
  document.getElementById('totalRepetidas').textContent = totalRep;
  document.getElementById('totalEquiposRep').textContent = equiposConRep;
}

function renderRepetidas(filter = '') {
  const container = document.getElementById('repContainer');
  const filtered = teamsData.filter(t => t.code.toLowerCase().includes((filter||'').toLowerCase()));
  container.innerHTML = '';
  filtered.forEach(team => {
    const rep = repState[team.code] || {};
    const totalRep = Object.values(rep).reduce((a,b) => a+b, 0);
    const block = document.createElement('div');
    block.className = 'team-block';
    block.dataset.code = 'rep-' + team.code;
    block.innerHTML = `
      <div class="team-header" onclick="toggleRepTeam('rep-${team.code}')">
        <div class="team-flag-name"><span class="team-flag">${team.flag}</span><span>${team.code}</span></div>
        <div class="team-badge">
          ${totalRep > 0 ? `<span class="team-count">Repetidas: <span>${totalRep}</span></span>` : '<span style="font-size:0.75rem;color:#4a6a85;">Sin repetidas</span>'}
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="nums-grid">
        ${team.all.map(n => {
          const key = String(n);
          const count = rep[key] || 0;
          const hasRep = count > 0;
          return `<button class="figu-btn-rep ${hasRep ? 'rep-has' : 'rep-none'}" onclick="openRepModal('${team.code}','${key}')">
            ${n}${hasRep ? `<span class="rep-count-badge">x${count}</span>` : ''}
          </button>`;
        }).join('')}
      </div>`;
    container.appendChild(block);
  });
  updateRepStats();
}

function toggleRepTeam(code) {
  const block = document.querySelector(`.team-block[data-code="${code}"]`);
  if (!block) return;
  const isOpen = block.classList.contains('open');
  document.querySelectorAll('.team-block.open').forEach(b => b.classList.remove('open'));
  if (!isOpen) block.classList.add('open');
}

function filterRep(val) { renderRepetidas(val); }

function openRepModal(teamCode, num) {
  const rep = repState[teamCode] || {};
  const currentCount = rep[String(num)] || 0;
  pendingRep = { teamCode, num };
  tempRepCount = currentCount === 0 ? 1 : currentCount;

  const team = teamsData.find(t => t.code === teamCode);
  document.getElementById('modalRepTitle').textContent = `${team ? team.flag : ''} ${teamCode} #${num}`;
  document.getElementById('modalRepText').textContent = currentCount > 0 ? `Tenés ${currentCount} repetida${currentCount > 1 ? 's' : ''}` : 'No está marcada como repetida';
  document.getElementById('repCountDisplay').textContent = tempRepCount;
  document.getElementById('modalRepOverlay').classList.add('active');
}

function changeRepCount(delta) {
  tempRepCount = Math.max(0, tempRepCount + delta);
  document.getElementById('repCountDisplay').textContent = tempRepCount;
}

function closeRepModal() {
  document.getElementById('modalRepOverlay').classList.remove('active');
  pendingRep = null;
}

function confirmRep() {
  if (!pendingRep) return;
  const { teamCode, num } = pendingRep;
  if (!repState[teamCode]) repState[teamCode] = {};
  if (tempRepCount === 0) {
    delete repState[teamCode][num];
  } else {
    repState[teamCode][num] = tempRepCount;
  }
  guardarRepetidas();
  closeRepModal();
  renderRepetidas(document.getElementById('searchRepInput').value);
}

document.getElementById('modalRepOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeRepModal();
});

// ========== TABS ==========
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('screen-' + tab).classList.add('active');
  if (tab === 'repetidas') {
    renderRepetidas();
  }
}

// ========== IMPRIMIR ==========
function imprimir() {
  const hoy = new Date().toLocaleDateString('es-AR');
  let totalFaltan = 0;
  teamsData.forEach(t => { const got = state[t.code] || []; totalFaltan += t.all.length - got.length; });
  const mitad = Math.ceil(teamsData.length / 2);
  const filas = teamsData.map((t) => {
    const got = (state[t.code] || []).map(String);
    const faltan = t.all.map(String).filter(n => !got.includes(n));
    return faltan.length === 0
      ? `<tr><td style="font-weight:bold;padding:1px 4px;font-size:9pt;">${t.code}</td><td style="color:#27ae60;font-size:9pt;">✓</td></tr>`
      : `<tr><td style="font-weight:bold;padding:1px 4px;font-size:9pt;">${t.code}</td><td style="color:#c0392b;font-weight:600;font-size:9pt;">${faltan.join(' - ')}</td></tr>`;
  });
  const col1 = filas.slice(0, mitad).join('');
  const col2 = filas.slice(mitad).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Figus Mateo y Pedro</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15mm; color: black; }
    h2 { text-align: center; font-size: 14pt; border-bottom: 2px solid #333; padding-bottom: 4px; margin-bottom: 4px; }
    p { text-align: center; font-size: 9pt; color: #555; margin-bottom: 8px; }
    .cols { display: flex; gap: 10mm; }
    table { border-collapse: collapse; width: 100%; }
    tr { border-bottom: 1px dotted #ccc; }
  </style>
  </head><body>
  <h2>⚽ Álbum Mateo y Pedro — Figus que faltan</h2>
  <p>Total faltantes: ${totalFaltan} &nbsp;|&nbsp; ${hoy}</p>
  <div class="cols">
    <table>${col1}</table>
    <table>${col2}</table>
  </div>
  <script>window.onload = function(){ window.print(); window.onafterprint = function(){ window.close(); }; }<\/script>
  </body></html>`;
  const ventana = window.open('', '_blank', 'width=800,height=600');
  ventana.document.write(html);
  ventana.document.close();
}

// ========== IMPRIMIR REPETIDAS ==========
function imprimirRepetidas() {
  const hoy = new Date().toLocaleDateString('es-AR');
  let totalRep = 0;
  const filas = [];
  teamsData.forEach(t => {
    const rep = repState[t.code] || {};
    const items = Object.entries(rep)
      .filter(([,cnt]) => cnt > 0)
      .sort((a,b) => {
        const na = isNaN(a[0]) ? a[0] : Number(a[0]);
        const nb = isNaN(b[0]) ? b[0] : Number(b[0]);
        return na > nb ? 1 : -1;
      })
      .map(([num, cnt]) => cnt > 1 ? `${num}(X${cnt})` : num);
    if (items.length > 0) {
      totalRep += items.length;
      filas.push(`<tr><td style="font-weight:bold;padding:2px 6px;font-size:9pt;white-space:nowrap;">${t.code}=</td><td style="font-size:9pt;color:#c0392b;font-weight:600;">${items.join('-')}</td></tr>`);
    }
  });
  const mitad = Math.ceil(filas.length / 2);
  const col1 = filas.slice(0, mitad).join('');
  const col2 = filas.slice(mitad).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Repetidas Mateo y Pedro</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15mm; color: black; }
    h2 { text-align: center; font-size: 14pt; border-bottom: 2px solid #333; padding-bottom: 4px; margin-bottom: 4px; }
    p { text-align: center; font-size: 9pt; color: #555; margin-bottom: 8px; }
    .cols { display: flex; gap: 10mm; }
    table { border-collapse: collapse; width: 100%; }
    tr { border-bottom: 1px dotted #ccc; }
  </style>
  </head><body>
  <h2>🔁 Repetidas Mateo y Pedro</h2>
  <p>Total repetidas: ${totalRep} &nbsp;|&nbsp; ${hoy}</p>
  <div class="cols">
    <table>${col1}</table>
    <table>${col2}</table>
  </div>
  <script>window.onload = function(){ window.print(); window.onafterprint = function(){ window.close(); }; }<\/script>
  </body></html>`;
  const ventana = window.open('', '_blank', 'width=800,height=600');
  ventana.document.write(html);
  ventana.document.close();
}

// ========== ARRANCAR ==========
async function init() {
  await cargarDesdeSupabase();
  await cargarRepetidas();
}
init();
</script>
